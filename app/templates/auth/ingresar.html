{% extends "base.html" %}

{% block title %}{{ t("auth.ingresar.titulo") }} · {{ laboratorio.nombre_comercial }}{% endblock %}

{% block content %}
<section class="tarjeta">
    <h1>{{ t("auth.ingresar.titulo") }}</h1>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/ingresar" autocomplete="on">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <label for="email">{{ t("auth.ingresar.correo") }}</label>
        <input id="email" name="email" type="email" required maxlength="254" autocomplete="username" value="{{ email or '' }}">
        <label for="clave">{{ t("auth.ingresar.clave") }}</label>
        <input id="clave" name="clave" type="password" required maxlength="128" autocomplete="current-password">
        <button type="submit">{{ t("auth.ingresar.continuar") }}</button>
    </form>
    <p class="nota">{{ t("auth.ingresar.nota_bloqueo") }}</p>
</section>
{% endblock %}
