{% extends "base.html" %}

{% block title %}Ingresar · {{ laboratorio.nombre_comercial }}{% endblock %}

{% block content %}
<section class="tarjeta">
    <h1>Ingresar</h1>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/ingresar" autocomplete="on">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" required maxlength="254" autocomplete="username" value="{{ email or '' }}">
        <label for="clave">Contraseña</label>
        <input id="clave" name="clave" type="password" required maxlength="128" autocomplete="current-password">
        <button type="submit">Continuar</button>
    </form>
    <p class="nota">Después de 5 intentos fallidos el acceso se bloquea durante 15 minutos.</p>
</section>
{% endblock %}
