# Configuración de herramientas de calidad (spec infraestructura/0011).
# Las dependencias viven en requirements*.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["e2e: pruebas de punta a punta con navegador (Playwright)"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["migrations/versions", "specs"]

[tool.ruff.lint]
# E/W/F: errores básicos · I: orden de imports · B: errores probables · S: seguridad (bandit)
# UP: sintaxis moderna · SIM: simplificaciones · ASYNC: errores en código asíncrono
select = ["E", "W", "F", "I", "B", "S", "UP", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# En pruebas se usan assert y contraseñas ficticias.
"tests/**" = ["S101", "S105", "S106"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "migrations"]
