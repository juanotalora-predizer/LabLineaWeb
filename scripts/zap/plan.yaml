# Plan de escaneo externo con ZAP (Automation Framework), spec infraestructura/0011.
# Lo ejecuta scripts/escaneo_externo.sh; las variables llegan por entorno.
env:
  contexts:
    - name: lablinea
      urls:
        - ${ZAP_OBJETIVO}
      includePaths:
        - ${ZAP_OBJETIVO}.*
      excludePaths:
        - ${ZAP_OBJETIVO}/salir.*   # no cerrar la sesión con la que se escanea
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true

jobs:
  # La sesión autenticada llega por las variables ZAP_AUTH_HEADER* (ver scripts/escaneo_externo.sh):
  # ZAP agrega la cookie del administrador sintético de lab-a a toda petición hacia ese sitio.

  # Descubre los endpoints declarados en el esquema OpenAPI.
  - type: openapi
    parameters:
      apiUrl: ${ZAP_OBJETIVO}/openapi.json
      targetUrl: ${ZAP_OBJETIVO}
      context: lablinea

  # Descubre lo que no está en el esquema (páginas HTML, estáticos).
  - type: spider
    parameters:
      context: lablinea
      url: ${ZAP_OBJETIVO}/panel
      maxDuration: 3

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  # Falsos positivos verificados, acotados a regla y ruta (evidencia en specs/etapas/).
  # 40018 en los formularios de edición del catálogo (etapa 6): cada POST guarda el texto tal cual (SQL con
  # parámetros, sin SQL dinámico en app/catalogo) y la página cambia con el dato nuevo; ZAP lo toma como
  # "más datos". La búsqueda (/catalogo?q=) y el importador quedan fuera del filtro. Prueba:
  # tests/test_catalogo.py::test_maestros_guardan_inyeccion_sql_como_texto_literal.
  - type: alertFilter
    alertFilters:
      - ruleId: 40018
        newRisk: False Positive
        url: https://[a-z0-9.-]+(:[0-9]+)?/catalogo/(maestros|examenes|parametros|rangos|requisitos)/.*
        urlRegex: true

  # Ataques activos: inyecciones, XSS, path traversal, cabeceras, etc.
  - type: activeScan
    parameters:
      context: lablinea
      maxRuleDurationInMins: 3
      maxScanDurationInMins: 30

  - type: report
    parameters:
      template: traditional-json
      reportDir: ${ZAP_REPORTES}
      reportFile: zap-reporte
    risks: [info, low, medium, high]

  - type: report
    parameters:
      template: traditional-html
      reportDir: ${ZAP_REPORTES}
      reportFile: zap-reporte
    risks: [info, low, medium, high]
