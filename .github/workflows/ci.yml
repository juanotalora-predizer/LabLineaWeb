name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: lablinea_dev
      DB_NAME_TEST: lablinea_test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks revisa todo el historial

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Instalar Chromium para las pruebas de punta a punta
        run: python -m playwright install --with-deps chromium

      - name: Generar contraseñas de los roles
        run: |
          echo "DB_OWNER_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "DB_APP_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "DB_PLATAFORMA_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "CLAVE_CIFRADO=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Crear roles y bases
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres \
            -v owner_pw="$DB_OWNER_PASSWORD" -v app_pw="$DB_APP_PASSWORD" -v plataforma_pw="$DB_PLATAFORMA_PASSWORD" \
            -f scripts/crear_bd_local.sql

      - name: Instalar gitleaks (versión fija, verificada por checksum)
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks.tar.gz

      - name: Compuerta de calidad (ruff, bandit, pip-audit, gitleaks, migraciones, pruebas, cobertura)
        env:
          PY: python
        run: scripts/verificar.sh
